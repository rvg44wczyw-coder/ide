[package]
name = "ide-ai"
version.workspace = true
edition.workspace = true

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = "0.27"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
ide-core = { path = "../core" }
ide-sanitizer = { path = "../sanitizer", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["sanitizer"]
sanitizer = ["dep:ide-sanitizer"]
