[package]
name = "ide-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ide"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.1", features = ["persistence"] }
egui = "0.36.1"
ide-ai = { path = "../ai" }
ide-core = { path = "../core" }
ide-dap = { path = "../dap" }
ide-lsp = { path = "../lsp" }
ide-sanitizer = { path = "../sanitizer" }
ide-tui = { path = "../tui" }
portable-pty = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
egui_kittest = "0.36"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19"
