[package]
name = "ide-core"
version.workspace = true
edition.workspace = true

[dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "https", "ssh", "vendored-openssl"] }
ignore = "0.4"
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core_benches"
harness = false
