[package]
name = "ide-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ide-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ide-ai = { path = "../ai" }
ide-core = { path = "../core" }
ide-dap = { path = "../dap" }
ide-lsp = { path = "../lsp" }
ide-sanitizer = { path = "../sanitizer" }
portable-pty = "0.9.0"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
