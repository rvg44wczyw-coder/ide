[workspace]
resolver = "2"
members = [
    "crates/ai",
    "crates/core",
    "crates/dap",
    "crates/lsp",
    "crates/sanitizer",
    "crates/tui",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
